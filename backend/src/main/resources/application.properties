# Настройка spring-dotenv для чтения .env из корня проекта
spring.profiles.active=dotenv,dev
spring dotenv.initialize=true
spring dotenv.ignore=.env.example,.env.template

# База данных - переменные из .env (в корне проекта)
# Имя базы — параметр (DB_NAME в .env), чтобы можно было увести эксперименты в отдельную БД.
# Зачем: изоляция по учебному периоду закрывает только размещения, а импорт заводит СПРАВОЧНИКИ —
# преподавателей, дисциплины, аудитории, — и они общие для всех периодов. Отдельная база делает
# откат кривого прогона одной командой DROP DATABASE вместо разбора RESTRICT-ов.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:schedule_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Настройка Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=off

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Пакетная запись. Повод — импорт: расписание в тысячи занятий писалось и проецировалось по одной
# строке, то есть round-trip на каждую, и на экране это выглядело зависанием.
# ⚠️ Работает НЕ для всех сущностей: при GenerationType.IDENTITY Hibernate обязан получить id сразу
# после вставки и батч молча отключает. Выигрыш здесь получают ровно те, ради кого это и включено, —
# lesson_placement и schedule_view (у обеих id — UUID, назначаемый приложением). Остальным
# (IDENTITY) настройка безвредна: она их просто не касается.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Кеширование
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Liquibase для управления миграциями базы данных
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Чистка архивных сессий: удаляются при генерации, если старше N дней (0 или меньше — выключить)
schedule.session.archive-retention-days=3

# Порядок изучения: норма отрыва занятия от предшествующей ему лекции, календарных дней.
# Больше нормы → занятие помечается как оторвавшееся («материал успевает забыться»).
# Аттестации (ЭКЗ/ЗО/ЗЧ) из этой проверки исключены — их место в конце курса.
# 0 или меньше — проверку отрыва выключить (находки «раньше своей лекции» от неё не зависят).
schedule.order.max-lecture-gap-days=17


# Импорт: пачка файлов выгрузки. Один файл ~250 КБ, но за раз присылают весь курс — а умолчания
# Spring (1 МБ на файл, 10 МБ на запрос) обрубили бы это на десятке файлов, причём 500-й ошибкой,
# в которой не видно, что упёрлись именно в лимит.
#
# Потолок на запрос поднят до 300 МБ (2026-08-15: живая выгрузка не влезла в 100 МБ). Выше не
# ставим намеренно: части запроса Spring пишет на диск, но разбор держит в памяти по ParsedSheet на
# файл — на многих сотнях файлов упор переедет с «слишком большой запрос» на OutOfMemory, а это
# отказ куда менее понятный. Если упрёмся снова — делить пачку, а не поднимать число.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=300MB

# Каталог, внутри которого разрешено читать выгрузку с диска (POST /api/import/inspect-folder).
# Это путь для полного объёма: в живом комплекте 1792 файла на 390 МБ, и гонять их через браузер
# незачем — бэкенд локальный, файлы на той же машине.
#
# Пусто — чтение с диска ВЫКЛЮЧЕНО. Так и задумано: аутентификации у приложения нет вовсе, а
# эндпоинт читает то, что ему назовут, — доступ к диску должен включаться явным действием.
# Пример: import.source-root=C:/Users/1/Documents/Расписание
import.source-root=${IMPORT_SOURCE_ROOT:}

logging.charset.console=UTF-8