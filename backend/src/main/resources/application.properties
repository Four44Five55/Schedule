# Настройка spring-dotenv для чтения .env из корня проекта
spring.profiles.active=dotenv,dev
spring dotenv.initialize=true
spring dotenv.ignore=.env.example,.env.template

# База данных - переменные из .env (в корне проекта)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/schedule_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Настройка Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=off

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Кеширование
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Liquibase для управления миграциями базы данных
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


logging.charset.console=UTF-8