plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.liquibase.gradle' version '2.2.1'
}

group = 'ru'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

// Компилируем исходники как UTF-8 (иначе кириллица в строковых литералах
// портится дефолтной кодировкой Windows ещё в .class)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starter (основные зависимости)
    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring Data JPA (для работы с БД)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-web'
//настроить Spring на правильную работу с Hibernate proxy
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    // Драйвер H2
    implementation 'com.h2database:h2'

    // Диалект Hibernate для SQLite
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.3.1.Final'


    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // Валидация: стартер тянет hibernate-validator + согласованную с Spring Boot
    // версию jakarta.validation-api и включает реальную работу @Valid/@NotNull/@NotEmpty
    // в Spring MVC (раньше был только API без движка — аннотации не срабатывали).
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.liquibase:liquibase-core'

    // OpenAPI/Swagger для документации API и генерации TypeScript типов
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Зависимости для работы с Excel (poi и poi-ooxml ДОЛЖНЫ быть одной версии)
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Библиотека для поддержки .env файлов
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")

    // Для тестирования
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    // Карантин интеграционных тестов (*IntegrationTest): они поднимают весь контекст
    // (@SpringBootTest) против живой dev-БД без изоляции (нет application-test / Testcontainers),
    // поэтому ломаются на дрейфе схемы/данных и блокируют обычную сборку. В `build`/`test`
    // остаются только быстрые unit-тесты. Интеграционные запускаются осознанно: `gradlew integrationTest`.
    // TODO: вернуть в общий прогон, когда появится изолированная тестовая БД (Testcontainers).
    exclude '**/*IntegrationTest*'
}

// Запуск только интеграционных тестов по требованию (против настроенной БД).
tasks.register('integrationTest', Test) {
    description = 'Запускает интеграционные тесты (@SpringBootTest) против настроенной БД.'
    group = 'verification'
    useJUnitPlatform()
    include '**/*IntegrationTest*'
    // Не кэшировать результат — зависит от внешнего состояния БД.
    outputs.upToDateWhen { false }
}

// Настройка bootRun для чтения .env из корня проекта
bootRun {
    // Указываем рабочую директорию как корень проекта
    workingDir = file('..')
    // Передаем системное свойство для spring-dotenv
    systemProperty 'dotenv.path', '../.env'
    // Передаем переменную окружения
    environment 'DOTENV_PATH', '../.env'
    // Принудительно UTF-8 для вывода в консоль (System.out/err),
    // иначе на Windows кириллица в логах будет в кодировке code page консоли
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

// Аналогичная настройка для bootJar
bootJar {
    enabled = true
}

