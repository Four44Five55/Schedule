# Демон Gradle перехватывает stdout форкнутого процесса bootRun и перевыводит
# его в терминал. Байты вывода подпроцесса JVM декодирует кодировкой из
# sun.jnu.encoding, а не file.encoding. На русской Windows sun.jnu.encoding =
# cp866 (OEM), поэтому корректный UTF-8 приложения ("—" = E2 80 94) читается как
# "тАФ" и затем отдаётся в терминал — получается мусор, хотя сам bootRun уже
# запущен с -Dstdout.encoding=UTF-8 и file.encoding=UTF-8 (через JAVA_TOOL_OPTIONS).
# Принудительно переводим JVM демона в UTF-8 целиком, включая sun.jnu.encoding.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
